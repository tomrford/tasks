name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          archive="tasks_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/tasks.exe .
            (cd dist && zip -q "${archive}.zip" tasks.exe)
          else
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/tasks .
            tar -czf "dist/${archive}.tar.gz" -C dist tasks
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tasks-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
